<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IndexAI · 免费额度、模型价格、中转站与评测索引</title>
<meta name="description" content="每天跟踪：能免费用的 AI 额度、各家 token 挂牌价（含缓存命中）、官方订阅价与第三方中转站报价。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#16a34a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e0c" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="IndexAI">
<meta property="og:title" content="IndexAI · AI 的价、量、场，一个入口看完">
<meta property="og:description" content="免费额度、token 单价、订阅区价、中转站报价、AI 活动、精选工具箱、评测与要闻——八层数据每天自动采集。">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --panel2:#fafafa; --panel3:#f2f2f2;
  --ink:#0a0a0a; --dim:#4f4f4f; --faint:#6d6d6d;
  --line:#e4e4e4; --line2:#bdbdbd;
  --accent:#e11d48; --accent-soft:#fdf0f3; --accent-ink:#ffffff;
  --good:#0f7b4f; --good-soft:#edf7f2; --warn:#8a5b00; --bad:#a4261d;
  --sans:"Inter","PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pad:clamp(16px,3vw,40px);
  --sect:clamp(30px,3.6vw,46px);
  --rule:1px solid var(--line);
}
[data-theme="dark"]{
  --bg:#0a0b0a; --panel:#111210; --panel2:#161815; --panel3:#1e201c;
  --ink:#e9e7df; --dim:#a9ada3; --faint:#8f9389;
  --line:#252822; --line2:#3a3e36;
  --accent:#fb5f7a; --accent-soft:#2a1218; --accent-ink:#0a0b0a;
  --good:#6ee7a8; --good-soft:#10241a; --warn:#e0b34d; --bad:#ff7a6b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-wrap:pretty}
a{color:inherit; text-decoration:none}
button,input,select{font:inherit; color:inherit}
::selection{background:var(--accent); color:#fff}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.wrap{max-width:1440px; margin:0 auto; padding:0 var(--pad)}
.eyebrow{font-family:var(--mono); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ── topbar ── */
.top{position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-bottom:var(--rule)}
.top .wrap{display:flex; align-items:center; gap:22px; height:60px}
.brand{display:flex; align-items:center; gap:10px; white-space:nowrap}
.glyph{width:15px; height:15px; flex:0 0 auto; fill:var(--ink); transition:fill .2s}
.brand:hover .glyph{fill:var(--accent)}
.brand b{font-size:15px; font-weight:700; letter-spacing:-.01em}
.brand span{font-family:var(--mono); font-size:11.5px; letter-spacing:.18em; color:var(--faint)}
.topnav{overflow-x:auto; scrollbar-width:none; display:flex; gap:2px; margin-left:6px; overflow:auto; scrollbar-width:none}
.topnav::-webkit-scrollbar-x{display:none}
.nav{appearance:none; border:0; background:none; padding:9px 6px; cursor:pointer; white-space:nowrap;
  font-size:13px; color:var(--dim); border-radius:3px; position:relative}
.nav:hover{color:var(--ink); background:var(--panel2)}
.nav[aria-selected="true"]{color:var(--ink); font-weight:600}
.nav[aria-selected="true"]::after{content:""; position:absolute; left:11px; right:11px; bottom:2px; height:2px; background:var(--accent)}
.nav sup{font-family:var(--mono); font-size:11.5px; color:var(--faint); margin-left:3px}
.top .right{margin-left:auto; display:flex; align-items:center; gap:10px}
.stamp{font-family:var(--mono); font-size:11.5px; color:var(--faint); white-space:nowrap}
.iconbtn{height:28px; padding:0 9px; border:1px solid var(--line); background:transparent; color:var(--dim);
  font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; cursor:pointer; border-radius:3px}
.iconbtn:hover{color:var(--ink); border-color:var(--line2)}
.iconbtn:focus-visible,.nav:focus-visible,.chip:focus-visible,th:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── hero ── */
.hero{border-bottom:var(--rule); background:linear-gradient(180deg, var(--panel2), var(--bg) 78%)}
.hero.compact .wrap{padding-top:22px; padding-bottom:18px; align-items:center}
.hero.compact h1{font-size:clamp(22px,2.5vw,32px); margin:6px 0 8px}
.hero.compact p{font-size:13.5px; max-width:64ch}
.hero.compact .jump{margin-top:12px}
.hero .wrap{padding-top:clamp(30px,4vw,54px); padding-bottom:0; display:grid; grid-template-columns:1fr; gap:0; align-items:start}
.hero h1{max-width:22ch}
.hero h1{margin:10px 0 12px; font-size:clamp(27px,3.5vw,46px); line-height:1.04; letter-spacing:-.035em; font-weight:700}
.hero h1 em{font-style:normal; color:var(--accent); letter-spacing:0}
.hero p{margin:0; color:var(--dim); font-size:15px; max-width:52ch; line-height:1.7}
.hero .kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; background:transparent;
  border:0; border-top:1px solid var(--ink); border-bottom:1px solid var(--line);
  margin-top:clamp(26px,3.4vw,44px)}
.kpi{background:var(--panel); padding:14px 16px}
.kpi .n{font-family:var(--mono); font-size:26px; font-weight:500; letter-spacing:-.03em; line-height:1.15}
.kpi .n small{font-size:12px; color:var(--faint); margin-left:4px; letter-spacing:0}
.kpi .k{font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.kpi .s{font-size:12px; color:var(--dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hero .jump{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap}
.jump a{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line2); padding:7px 12px; font-size:12px;
  background:var(--panel); border-radius:3px}
.jump a:hover{border-color:var(--accent); color:var(--accent)}
.jump a b{font-family:var(--mono); font-weight:500}

/* ── table note ── */
.tnote{margin:0 0 10px; font-size:12px; color:var(--faint); font-family:var(--mono); letter-spacing:.02em}



.distbar{position:relative; height:46px; margin:0 0 18px; border-bottom:1px solid var(--line)}
.distbar svg{display:block; width:100%; height:46px; overflow:visible}
.distbar .db-pt{fill:#8b8b8b; opacity:.5}
.distbar .db-pt.on{fill:var(--accent); opacity:.95}
.distbar .db-lbl{font-family:var(--mono); font-size:10.5px; fill:var(--faint)}


/* ── 中转站价格轴 ── */
.rax{margin:6px 0 20px; padding:18px 0 6px; border-top:1px solid var(--line)}
.raxhead{display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; margin-bottom:8px}
.raxhead h3{margin:0; font-size:clamp(16px,1.5vw,19px); font-weight:600; letter-spacing:-.02em}
.raxhead p{margin:0; font-size:12.5px; color:var(--faint); max-width:60ch; line-height:1.6}
.raxbars{display:flex; flex-direction:column; gap:1px; margin-top:6px}
.rb{display:grid; grid-template-columns:clamp(96px,12vw,150px) 1fr 62px clamp(56px,7vw,84px);
  align-items:center; gap:12px; padding:5px 0; text-decoration:none; color:inherit;
  border-bottom:1px solid var(--line); transition:background .2s}
.rb:hover{background:var(--panel2)}
.rb-n{font-size:12.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rb-bar{position:relative; height:6px; background:var(--panel3); border-radius:1px; overflow:hidden}
.rb-bar i{display:block; height:100%; background:var(--ink); opacity:.75; width:0;
  animation:growbar .9s cubic-bezier(.16,1,.3,1) forwards; animation-delay:calc(var(--i,0) * 35ms)}
@keyframes growbar{to{width:var(--w,0%)}}
.rb.low .rb-bar i{background:#0f7b4f}
.rb.high .rb-bar i{background:var(--accent)}
.rb-v{font-family:var(--mono); font-size:12.5px; text-align:right; font-variant-numeric:tabular-nums}
.rb-x{font-family:var(--mono); font-size:11px; color:var(--faint); text-align:right; white-space:nowrap}
.rb.high .rb-x{color:var(--accent)}
.rb.low .rb-x{color:#0f7b4f}
@media (max-width:760px){.rb{grid-template-columns:96px 1fr 54px}.rb-x{display:none}}


/* ── 订阅区间条 ── */
.sbars{display:flex; flex-direction:column; gap:1px; margin-bottom:var(--sect)}
.sb{display:grid; grid-template-columns:clamp(120px,15vw,190px) 1fr clamp(110px,14vw,168px) 62px;
  align-items:center; gap:12px; padding:6px 0; text-decoration:none; color:inherit;
  border-bottom:1px solid var(--line); transition:background .2s}
.sb:hover{background:var(--panel2)}
.sb-n{font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sb-track{position:relative; height:7px; background:var(--panel3); border-radius:1px}
.sb-track i{position:absolute; top:0; bottom:0; background:linear-gradient(90deg, #0f7b4f, var(--accent));
  border-radius:1px; opacity:.9; width:0; animation:growbar 1s cubic-bezier(.16,1,.3,1) forwards;
  animation-delay:calc(var(--i,0) * 35ms)}
.sb-v{font-family:var(--mono); font-size:11.5px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap}
.sb-x{font-family:var(--mono); font-size:11.5px; text-align:right; color:var(--accent); white-space:nowrap}
@media (max-width:760px){.sb{grid-template-columns:110px 1fr 56px}.sb-v{display:none}}


/* ── 活动时间轴 ── */
.tlsec{margin-bottom:var(--sect); padding-top:18px; border-top:1px solid var(--line)}
.tlhead{display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; margin-bottom:6px}
.tlhead h3{margin:0; font-size:clamp(16px,1.5vw,19px); font-weight:600; letter-spacing:-.02em}
.tlhead p{margin:0; font-size:12.5px; color:var(--faint)}
#eventTimeline{display:block; width:100%; height:clamp(200px,22vw,260px); overflow:visible}
.tlsec .tl-bar{transition:opacity .18s}
.tlsec .tl-bar:hover{opacity:1!important}
.tlsec .tl-t{fill:var(--faint); font-family:var(--mono); font-size:11px}
.tlsec .tl-grid{stroke:var(--line); stroke-width:1}
.tlsec .tl-now{stroke:var(--accent); stroke-width:1.5; stroke-dasharray:3 3}
.tlsec .tl-nowt{fill:var(--accent); font-family:var(--mono); font-size:11px}
.tllegend{display:flex; gap:18px; margin-top:8px; font-size:11.5px; color:var(--faint); font-family:var(--mono)}
.tllegend span{display:flex; align-items:center; gap:6px}
.tllegend i{width:10px; height:8px; border-radius:1px}


/* ── 工具箱星数带 ── */
.starband{display:flex; flex-direction:column; gap:1px; margin:0 0 var(--sect); border-top:1px solid var(--ink)}
.sbrow{display:grid; grid-template-columns:clamp(120px,17vw,220px) 1fr 58px;
  align-items:center; gap:12px; padding:4px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit}
.sbrow:hover{background:var(--panel2)}
.sbrow .n{font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dim)}
.sbrow .t{position:relative; height:4px; background:var(--panel3)}
.sbrow .t i{display:block; height:100%; background:var(--ink); opacity:.7; width:0;
  animation:growbar .85s cubic-bezier(.16,1,.3,1) forwards; animation-delay:calc(var(--i,0)*30ms)}
.sbrow .s{font-family:var(--mono); font-size:11.5px; text-align:right; color:var(--faint); font-variant-numeric:tabular-nums}
.sbrow:hover .n{color:var(--ink)}
@media (max-width:760px){.sbrow{grid-template-columns:110px 1fr 48px}}


/* ── 键盘可达性 ── */
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
a:focus-visible,button:focus-visible{outline-offset:3px; border-radius:2px}
.skip{position:absolute; left:-9999px; top:0; z-index:9999; background:var(--ink); color:var(--bg);
  padding:10px 16px; font-size:13px; text-decoration:none}
.skip:focus{left:8px; top:8px}
.tablewrap:focus-visible{outline:2px solid var(--accent); outline-offset:2px}


/* ── 视图切换过渡 ── */
#view{transition:opacity .26s ease, transform .42s cubic-bezier(.16,1,.3,1)}
#view.swapping{opacity:0; transform:translate3d(0,10px,0)}
@media (prefers-reduced-motion:reduce){#view{transition:none}}


/* ── 评测散点 ── */
.bsc{margin:0 0 var(--sect); padding-top:20px; border-top:1px solid var(--line)}
.bschead{display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; margin-bottom:8px}
.bschead h3{margin:0; font-size:clamp(16px,1.5vw,19px); font-weight:600; letter-spacing:-.02em}
.bschead p{margin:0; font-size:12.5px; color:var(--faint); max-width:54ch; line-height:1.6}
#benchScatter{display:block; width:100%; height:clamp(240px,26vw,320px); overflow:visible}
.bsc .bs-grid{stroke:var(--line); stroke-width:1; stroke-dasharray:1 4}
.bsc .bs-ax{stroke:var(--ink); stroke-width:1}
.bsc .bs-t{fill:var(--faint); font-family:var(--mono); font-size:11px}
.bsc .bs-pt{fill:var(--ink); opacity:.8}
.bsc .bs-pt.top{fill:var(--accent); opacity:1}
.bsc .bs-lb{fill:var(--dim); font-size:11.5px}
.bsc .bs-lb.top{fill:var(--accent); font-weight:600}
.bsc .bs-pt.val{fill:#0f7b4f; opacity:1}
.bsc .bs-lb.val{fill:#0f7b4f; font-weight:600}
.bsc .bs-pt{opacity:.55}
.bsc .bs-guide{stroke:var(--line2); stroke-width:1; stroke-dasharray:4 4}
.bsc .bs-axt{fill:var(--faint); font-size:11px}
td .val{color:#0f7b4f; font-weight:500}
.bslegend{display:flex; gap:20px; margin-top:6px; font-size:11.5px; color:var(--faint); font-family:var(--mono)}
.bslegend span{display:flex; align-items:center; gap:6px}
.bslegend i.dot{width:7px; height:7px; border-radius:50%; background:var(--ink)}
.bslegend i.dot.top{background:var(--accent)}
.bslegend i.dot.val{background:#0f7b4f}
.bslegend i.line{width:16px; height:1px; background:var(--line2)}

/* ── 团队在用（应用榜） ── */
.applist{display:flex; flex-direction:column; gap:1px; margin-bottom:var(--sect)}
.approw{display:grid; grid-template-columns:clamp(140px,18vw,240px) 150px 1fr 58px;
  align-items:center; gap:12px; padding:7px 0; border-bottom:1px solid var(--line);
  text-decoration:none; color:inherit}
.approw:hover{background:var(--panel2)}
.ar-n{font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ar-c{display:flex; gap:4px; flex-wrap:wrap}
.ar-c i{font-style:normal; font-family:var(--mono); font-size:10.5px; color:var(--faint);
  border:1px solid var(--line); padding:1px 5px; border-radius:2px}
.ar-t{height:5px; background:var(--panel3); position:relative}
.ar-t i{display:block; height:100%; background:var(--ink); opacity:.7}
.ar-v{font-family:var(--mono); font-size:11.5px; text-align:right; color:var(--faint); font-variant-numeric:tabular-nums}
@media (max-width:760px){.approw{grid-template-columns:1fr 62px}.ar-c,.ar-t{display:none}}

/* ── 颗粒质感 ── */
.grain{position:fixed; inset:0; pointer-events:none; z-index:9998; opacity:.032; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
[data-theme="dark"] .grain{opacity:.05; mix-blend-mode:screen}
@media (prefers-reduced-motion:reduce){.grain{opacity:.02}}


/* ── 滚动叙事 ── */
.story{position:relative; margin:0 0 var(--sect)}
.story-track{height:190vh; position:relative}
.story-pin{position:sticky; top:56px; padding-top:26px; border-top:1px solid var(--line);
  background:var(--bg); z-index:2}
.story-cap{position:relative; min-height:78px}
.story-cap h2{margin:0 0 8px; font-size:clamp(19px,2.2vw,27px); font-weight:600; letter-spacing:-.03em}
.story-cap h2 em{font-style:normal; color:var(--accent)}
.story-line{position:absolute; left:0; top:46px; margin:0; font-size:14px; color:var(--dim); line-height:1.6;
  opacity:0; transform:translateY(8px); transition:opacity .45s ease, transform .45s cubic-bezier(.16,1,.3,1);
  pointer-events:none; max-width:60ch}
.story-line b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.story-line.on{opacity:1; transform:none}
.story-cap h2{transition:opacity .4s ease}
.story-rail{height:2px; background:var(--line); margin-top:8px; overflow:hidden}
.story-rail i{display:block; height:100%; width:0; background:var(--accent); transition:width .12s linear}
.story .axfoot{margin-top:8px}
#priceAxis .dot{transition:opacity .5s ease, fill .4s ease, r .3s ease}
#priceAxis .dot.dim{opacity:.1}
#priceAxis .dot.lit{opacity:1}
#priceAxis .dot.mark{r:5.5}
@media (max-width:760px){
  .story-track{height:150vh}
  .story-pin{top:44px; padding-top:18px}
  .story-cap{min-height:96px}
  .story-line{font-size:13px}
}

/* ── 价格轴 ── */
.axsec{margin:0 0 44px; border-top:1px solid var(--line); padding-top:26px}
.axhead{display:flex; align-items:baseline; gap:22px; flex-wrap:wrap; margin-bottom:4px}
.axhead h2{margin:0; font-size:clamp(19px,2.1vw,26px); font-weight:600; letter-spacing:-.03em}
.axhead h2 em{font-style:normal; color:var(--accent)}
.axsub{margin:0; font-size:13px; color:var(--faint); max-width:52ch; line-height:1.6}
#priceAxis{display:block; width:100%; height:clamp(220px,26vw,300px); margin-top:14px; overflow:visible}
.axfoot{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11.5px;
  color:var(--faint); margin-top:6px; letter-spacing:.02em}
.story .tick-l{stroke:var(--line2); stroke-width:1}
.story .tick-t{fill:var(--faint); font-family:var(--mono); font-size:11px}
.story .grid-l{stroke:var(--line); stroke-width:1; stroke-dasharray:1 4}
.story .dot{fill:#0a0a0a; opacity:.62; transition:r .18s ease, opacity .18s ease}
.story .dot.agg{fill:#8b8b8b}
.story .dot.free{fill:#0f7b4f}
.story .dot.hot{r:5.4; opacity:1}
.story .axlabel{font-family:var(--sans); font-size:12px; fill:var(--dim)}
.story .axlabel b{font-weight:600; fill:var(--ink)}
.story .axline{stroke:var(--ink); stroke-width:1}
.story .den{fill:var(--accent); fill-opacity:.06; stroke:var(--accent); stroke-width:1; stroke-opacity:.32; stroke-linejoin:round}
[data-theme="dark"] .story .dot{fill:#e9e7df}
[data-theme="dark"] .story .den{fill-opacity:.16; stroke-opacity:.55}
[data-theme="dark"] .story .dot.agg{fill:#7c7f72}
@media (max-width:760px){.axhead{gap:10px}.axsub{font-size:12.5px}.axfoot span:last-child{display:none}}

/* ── ticker (A) ── */
.ticker{background:#0a0b0a;color:#e9e7df;overflow:hidden;border-bottom:1px solid #1c1e1a}
.ticker-track{display:flex;width:max-content;animation:tickmove 54s linear infinite}
.ticker-track:hover{animation-play-state:paused}
.ticker i{display:flex;align-items:center;gap:10px;padding:9px 18px;border-right:1px solid #22241f;
  font:500 11.5px/1 var(--mono);font-style:normal;color:#9aa096;white-space:nowrap}
.ticker i b{color:#e9e7df;font-weight:500}
.ticker i s{color:#6ee7a8;text-decoration:none}
.ticker i u{color:#fb5f7a;text-decoration:none}
@keyframes tickmove{to{transform:translate3d(-50%,0,0)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}

/* ── section header ── */
.shead{display:flex; align-items:baseline; gap:14px; padding:26px 0 14px; border-bottom:var(--rule); flex-wrap:wrap}
.shead h2{margin:0; font-size:clamp(20px,2vw,26px); letter-spacing:-.03em; font-weight:600}
.shead .desc{font-size:12.5px; color:var(--dim); max-width:70ch}
.shead .right{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--faint)}

/* ── controls ── */
.controls{display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:14px 0}
.search{flex:1 1 280px; min-width:200px; display:flex; align-items:center; gap:8px; border:1px solid var(--line);
  background:var(--panel); padding:0 10px; height:36px; border-radius:3px}
.search input{flex:1; min-width:0; border:0; background:none; outline:none; font-size:12.5px}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search kbd{font-family:var(--mono); font-size:11.5px; color:var(--faint); border:1px solid var(--line); padding:0 5px; border-radius:2px}
.sel{height:36px; border:1px solid var(--line); background:var(--panel); padding:0 30px 0 10px; font-size:12px; appearance:none; cursor:pointer; border-radius:3px;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 14px) 16px,calc(100% - 10px) 16px; background-size:4px 4px,4px 4px; background-repeat:no-repeat}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{height:28px; padding:0 11px; border:1px solid var(--line); background:var(--panel); color:var(--dim);
  font-size:11.5px; cursor:pointer; border-radius:3px; white-space:nowrap}
.chip:hover{color:var(--ink); border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.spacer{flex:1}

/* sliders */
.sliders{display:flex; flex-wrap:wrap; gap:26px; align-items:flex-end; padding:0 0 16px}
.slider{flex:1 1 260px; min-width:210px}
.slider .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
.slider output{font-family:var(--mono); font-size:16px; color:var(--accent); font-weight:600}
input[type=range]{appearance:none; width:100%; height:14px; background:none; cursor:pointer; display:block}
input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--line2)}
input[type=range]::-webkit-slider-thumb{appearance:none; width:12px; height:16px; margin-top:-7px; background:var(--accent); border:0; border-radius:2px}
input[type=range]::-moz-range-track{height:2px; background:var(--line2)}
input[type=range]::-moz-range-thumb{width:12px; height:16px; background:var(--accent); border:0; border-radius:2px}
.formula{font-family:var(--mono); font-size:12px; color:var(--faint); padding-bottom:17px}
.formula b{color:var(--dim); font-weight:400}

/* ── table ── */
.tablewrap{overflow:auto; max-height:calc(100vh - 250px); border-bottom:var(--rule)}
table{width:100%; min-width:1180px; border-collapse:collapse; font-size:13px}
thead th{position:sticky; top:0; z-index:5; background:var(--bg); text-align:left; font-weight:400;
  border-bottom:1px solid var(--line2); padding:10px; white-space:nowrap; cursor:pointer;
  font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}
thead th.num{text-align:right}
thead th:hover{color:var(--ink)}
thead th i{font-style:normal; color:var(--accent); margin-left:4px}
thead th[aria-sort="ascending"],thead th[aria-sort="descending"]{color:var(--ink)}
tbody tr{border-bottom:var(--rule); cursor:pointer}
tbody tr:hover{background:var(--panel2)}
td{padding:9px 10px; vertical-align:middle}
td.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.mname{display:flex; align-items:center; gap:7px; min-width:0}
.mname .txt{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mname .id{font-family:var(--mono); font-size:11.5px; color:var(--faint)}
.vend{font-size:12px; color:var(--dim); white-space:nowrap}
.tag{display:inline-block; font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; border:1px solid var(--line2);
  padding:0 4px; color:var(--dim); white-space:nowrap; border-radius:2px; vertical-align:1px}
.tag.new{border-color:var(--accent); color:var(--accent)}
.tag.free{border-color:var(--good); color:var(--good)}
.tag.direct{border-color:var(--good); color:var(--good)}
.tag.warn{border-color:var(--warn); color:var(--warn)}
.dim{color:var(--faint)}
.best{color:var(--good); font-weight:600}
.src a{display:inline-flex; align-items:center; gap:4px; color:var(--faint); font-family:var(--mono); font-size:11.5px}
.src a:hover{color:var(--accent)}
.conf{width:5px; height:5px; border-radius:50%; display:inline-block; background:var(--good)}
.conf.med{background:var(--warn)} .conf.low{background:var(--bad)}
[data-density="compact"] td{padding:5px 10px}
[data-density="compact"] tbody{font-size:12.5px}
.tfoot{display:flex; align-items:center; gap:14px; padding:10px 0; font-family:var(--mono); font-size:11.5px; color:var(--faint); flex-wrap:wrap}
.tfoot .more{border:1px solid var(--line); background:var(--panel); color:var(--dim); padding:5px 10px; cursor:pointer; font-size:11.5px; border-radius:3px}
.tfoot .more:hover{color:var(--accent); border-color:var(--accent)}

/* ── cards ── */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; padding:18px 0 28px}
.card{background:var(--panel); border:var(--rule); border-radius:4px; padding:16px 17px 14px; display:flex; flex-direction:column; gap:10px}
.card:hover{border-color:var(--line2)}
.card .hd{display:flex; align-items:flex-start; gap:10px}
.card h3{margin:0; font-size:15.5px; font-weight:600; letter-spacing:-.01em}
.card .sub{font-family:var(--mono); font-size:11.5px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase; margin-top:1px}
.card p{margin:0; font-size:13px; color:var(--dim); line-height:1.62}
.card dl{display:grid; grid-template-columns:auto 1fr; gap:5px 12px; margin:0; font-size:12px}
.card dt{font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding-top:3px}
.card dd{margin:0}
.card .foot{margin-top:auto; display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  padding-top:9px; border-top:var(--rule); position:relative}
.card .foot a{font-family:var(--mono); font-size:11.5px; color:var(--dim); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line2)}
.card .foot a:hover{color:var(--accent)}
.mchips{display:flex; flex-wrap:wrap; gap:4px}
.mchip{font-family:var(--mono); font-size:11.5px; border:1px solid var(--line); padding:0 5px; color:var(--dim); border-radius:2px}

/* ── subscription cards ── */
.shop{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; padding:18px 0 8px; align-items:start}
.plan{background:var(--panel); border:var(--rule); border-radius:4px; overflow:hidden}
.plan .ph{display:flex; align-items:baseline; justify-content:space-between; padding:14px 16px 10px; border-bottom:var(--rule)}
.plan .ph h3{margin:0; font-size:16px; font-weight:600}
.plan .ph span{font-family:var(--mono); font-size:11.5px; color:var(--faint)}
.plan .rows{padding:4px 16px 12px}
.prow{display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.prow .tier{font-weight:500; min-width:64px}
.prow .note{font-size:12px; color:var(--faint); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prow .p{font-family:var(--mono); font-size:15px; font-weight:500}
.prow .p small{font-size:11.5px; color:var(--faint); font-weight:400}
.prow .cny{font-family:var(--mono); font-size:11.5px; color:var(--faint); min-width:56px; text-align:right}

/* ── relay ── */
.relaybar{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; background:var(--line); border:var(--rule); margin:18px 0 6px}
.relaybar .cell{background:var(--panel); padding:12px 14px}
.relaybar .cell .k{font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}
.relaybar .cell .v{font-family:var(--mono); font-size:21px; letter-spacing:-.02em; margin-top:2px}
.idx{display:inline-flex; align-items:center; gap:6px; justify-content:flex-end}
.idx .bar{width:54px; height:4px; background:var(--panel3); position:relative; overflow:hidden; border-radius:1px}
.idx .bar i{position:absolute; left:0; top:0; bottom:0; background:var(--good)}
.idx .bar i.over{background:var(--bad)}
.idx .num{font-family:var(--mono); font-size:12px}
.status{font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; border:1px solid var(--line2); padding:0 5px; border-radius:2px; color:var(--dim)}
.status.ok{border-color:var(--good); color:var(--good)}
.status.stale{border-color:var(--warn); color:var(--warn)}
.status.off{border-color:var(--line); color:var(--faint)}
.cand{display:flex; flex-wrap:wrap; gap:6px; padding:12px 0 28px}
.cand a{font-family:var(--mono); font-size:12px; border:1px solid var(--line); padding:4px 8px; border-radius:3px; color:var(--dim); background:var(--panel)}
.cand a:hover{border-color:var(--accent); color:var(--accent)}

/* ── signals ── */
.timeline{border-bottom:var(--rule)}
.sig{display:grid; grid-template-columns:112px 1fr; gap:20px; padding:18px 0; border-top:var(--rule)}
.sig:first-child{border-top:0}
.sig .when{font-family:var(--mono); font-size:11.5px; color:var(--faint); padding-top:2px}
.sig .when b{display:block; color:var(--dim); font-weight:400; font-size:12px; margin-bottom:2px}
.sig h4{margin:0 0 6px; font-size:14px; font-weight:600; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.sig blockquote{margin:0; padding-left:12px; border-left:2px solid var(--line2); color:var(--dim); font-size:13px; line-height:1.66}
.sig .links{display:flex; gap:12px; margin-top:8px; flex-wrap:wrap; align-items:center}
.sig .links a{font-family:var(--mono); font-size:11.5px; color:var(--faint); text-decoration:underline; text-underline-offset:3px}
.sig .links a:hover{color:var(--accent)}

/* ── method ── */
.doc{max-width:840px; margin:0 auto; padding:22px 0 60px}
.doc h2{font-size:13px; font-family:var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
  font-weight:400; margin:32px 0 12px; padding-bottom:8px; border-bottom:var(--rule)}
.doc h2:first-child{margin-top:0}
.doc p{margin:0 0 12px; color:var(--dim); line-height:1.75}
.doc strong{color:var(--ink); font-weight:600}
.doc ol,.doc ul{margin:0 0 14px; padding-left:20px; color:var(--dim); line-height:1.85}
.doc code{font-family:var(--mono); font-size:12px; background:var(--panel2); padding:1px 5px; border-radius:2px; color:var(--ink)}
.code{display:block; padding:13px 15px; border:var(--rule); background:var(--panel); line-height:1.7; overflow-x:auto; white-space:pre;
  font-family:var(--mono); font-size:12px; color:var(--dim); border-radius:3px}
.srcs{width:100%; min-width:0; table-layout:fixed; font-size:12px}
.srcs td{padding:7px 8px; border-bottom:var(--rule); word-break:break-all}
.srcs td.u{font-family:var(--mono); font-size:11.5px; color:var(--dim)}

/* ── drawer ── */
.overlay{position:fixed; inset:0; background:rgba(10,10,8,.42); opacity:0; pointer-events:none; transition:opacity .2s; z-index:60}
.overlay[data-open="1"]{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(480px,94vw); background:var(--panel); border-left:1px solid var(--line2);
  transform:translateX(101%); transition:transform .25s cubic-bezier(.2,.8,.2,1); z-index:61; overflow-y:auto; padding:22px 24px 40px}
.drawer[data-open="1"]{transform:none}
.drawer .close{float:right; border:1px solid var(--line); background:none; color:var(--dim); width:26px; height:26px; cursor:pointer; border-radius:3px}
.drawer .close:hover{color:var(--ink); border-color:var(--line2)}
.drawer h2{margin:6px 0 3px; font-size:21px; letter-spacing:-.02em}
.drawer .sub{font-family:var(--mono); font-size:12px; color:var(--faint); word-break:break-all}
.pricegrid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:var(--rule); margin:18px 0 14px; border-radius:3px; overflow:hidden}
.pcell{background:var(--panel); padding:11px 13px}
.pcell .k{font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.pcell .v{font-family:var(--mono); font-size:17px; font-weight:500; margin-top:2px}
.drawer dl{display:grid; grid-template-columns:78px 1fr; gap:8px 12px; margin:14px 0; font-size:13px}
.drawer dt{font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding-top:3px}
.drawer dd{margin:0; line-height:1.6; word-break:break-word}
.drawer .note{color:var(--dim); font-size:12.5px; border-top:var(--rule); padding-top:12px; margin-top:14px; line-height:1.7}

.empty{padding:64px 0; text-align:center; color:var(--faint); font-family:var(--mono); font-size:12px; line-height:2}
.empty b{display:block; color:var(--dim); font-size:13px; margin-bottom:4px; font-weight:400}
footer.foot{border-top:var(--rule); padding:20px 0 44px; color:var(--faint); font-family:var(--mono); font-size:11.5px; display:flex; gap:18px; flex-wrap:wrap; background:var(--bg)}
footer.foot a{text-decoration:underline; text-underline-offset:3px}
footer.foot a:hover{color:var(--accent)}
.routes{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; padding:16px 0 8px}
.route{background:var(--panel); border:var(--rule); border-radius:4px; padding:14px 15px}
.route h4{margin:0 0 6px; font-size:13.5px}
.route p{margin:0; font-size:12px; color:var(--dim); line-height:1.6}
.route .risk{font-family:var(--mono); font-size:11.5px; color:var(--warn); margin-top:8px; letter-spacing:.04em}
@media (max-width:1080px){
  .hero .wrap{grid-template-columns:1fr; gap:26px}
  .relaybar{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .top .wrap{height:auto; padding-top:10px; padding-bottom:10px; flex-wrap:wrap; gap:8px 14px}
  .topnav{order:3; width:100%; margin-left:0; border-top:var(--rule); padding-top:6px;
    -webkit-mask-image:linear-gradient(to right, #000 90%, transparent); mask-image:linear-gradient(to right, #000 90%, transparent)}
  .hero .wrap{padding-top:26px; padding-bottom:22px}
  .hero h1{font-size:30px}
  .hero .kpis{grid-template-columns:1fr 1fr}
  .tablewrap{max-height:none}
  table{min-width:0; table-layout:fixed}
  td.hidesm,th.hidesm{display:none}
  td,th{padding-left:6px; padding-right:6px}
  td:nth-child(1),th:nth-child(1){width:42%}
  td:nth-child(4),th:nth-child(4),
  td:nth-child(7),th:nth-child(7),
  td:nth-child(9),th:nth-child(9){width:19%}
  .mname .txt{white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .mname .id{display:none}
  .rtable td:nth-child(1),.rtable th:nth-child(1){width:36%}
  .rtable td:nth-child(2),.rtable th:nth-child(2){width:15%}
  .rtable td:nth-child(3),.rtable th:nth-child(3){width:33%}
  .rtable td:nth-child(4),.rtable th:nth-child(4){width:16%}
  .rtable .status{font-size:8px; padding:0 3px}
  .rtable td.num{font-size:12px; white-space:normal}
  .rtable td .tag.warn{display:block; margin-top:2px; width:max-content}
  .nav{font-size:12px; white-space:nowrap; flex:0 0 auto; padding:9px 8px}
  .sig{grid-template-columns:1fr; gap:8px}
  .doc{padding:10px 0 40px}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important; transition:none!important}}

.regions{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1px; background:var(--line); border-block:var(--rule); margin-bottom:28px}
.rcard{background:var(--panel); padding:14px 16px 12px}
.rcard .rh{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px}
.rcard .rh h3{margin:0; font-size:13px; font-weight:600; letter-spacing:.01em}
.rcard .rh h3 em{font-style:normal; color:var(--dim); font-weight:400}
.rcard .rh span{font-family:var(--mono); font-size:11.5px; color:var(--faint); white-space:nowrap}
.rrow{display:grid; grid-template-columns:18px 1fr auto auto; gap:8px; align-items:center; padding:4px 2px; border-top:1px solid var(--line); font-size:12px; color:var(--dim); text-decoration:none}
.rrow:hover{background:var(--panel2); color:var(--ink)}
.rrow .idx{font-family:var(--mono); font-size:11.5px; color:var(--faint)}
.rrow .cty{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rrow .raw{font-family:var(--mono); font-size:11.5px; color:var(--faint)}
.rrow .cny{font-family:var(--mono); font-size:11.5px; font-variant-numeric:tabular-nums}
.rrow.low .cny{color:var(--accent); font-weight:600}
.rfoot{margin-top:8px; padding-top:7px; border-top:1px solid var(--line); font-size:11.5px; color:var(--faint); font-family:var(--mono)}
.rfoot b{color:var(--accent); font-weight:600}

/* ── home ── */
.home-top{display:grid; grid-template-columns:1fr; gap:0; background:transparent; border:0; margin-bottom:0}
.home-side{display:none}
.home-lead{background:var(--panel); padding:30px clamp(16px,2.4vw,34px) 26px}
.kicker{font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:14px}
.home-h{margin:0 0 10px; font-size:clamp(30px,4.1vw,50px); line-height:1.06; letter-spacing:-.025em; font-weight:600}
.home-h b{color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums}
.home-h .unit{font-size:.34em; color:var(--dim); font-weight:400; letter-spacing:0; margin-left:.35em; vertical-align:.9em}
.home-sub{margin:0; font-size:13.5px; line-height:1.65; color:var(--dim); max-width:52ch}
.home-sub strong{color:var(--ink); font-weight:600}
.home-facts{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; background:var(--line); margin-top:24px; border-top:var(--rule)}
.home-facts>div{background:var(--panel); padding:12px 12px 10px; display:flex; flex-direction:column; gap:3px; min-width:0}
.home-facts .fk{font-size:11.5px; letter-spacing:.06em; color:var(--faint); text-transform:uppercase; font-family:var(--mono)}
.home-facts .fv{font-family:var(--mono); font-size:20px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.home-facts .fd{font-size:11.5px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.home-side{display:none}
.hs-head{font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:10px}
.hs-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:7px 0; border-top:1px solid var(--line); color:var(--dim); text-decoration:none; font-size:12.5px}
.hs-row:first-of-type{border-top:0}
.hs-row:hover{color:var(--ink)}
.hs-row b{font-family:var(--mono); font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums}
.hs-row:hover b{color:var(--accent)}

.newsrow{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; background:transparent;
  border-top:1px solid var(--ink); margin-bottom:var(--sect)}
.newsrow .ncard{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:16px 18px 20px 0}
.newsrow .ncard:nth-child(4n){border-right:0; padding-right:0}
.ncard{background:transparent; padding:16px 18px 18px 0; display:flex; flex-direction:column; gap:8px; transition:background .22s}
.ncard:hover{background:var(--panel2)}

/* ══════ motion（独立于主 IIFE，主流程可以随时调 MOTION.arm()） ══════ */
const MOTION = (() => {
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  const vh = () => innerHeight || 800;

  function countUp(el, to, opt = {}) {
    const { dur = 1000, dec = 0, pre = "", suf = "" } = opt;
    if (reduced) { el.textContent = pre + to.toFixed(dec) + suf; return; }
    const t0 = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      el.textContent = pre + (to * ease(t)).toFixed(dec) + suf;
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  const io = new IntersectionObserver((es) => {
    es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.04, rootMargin: "0px 0px -3% 0px" });

  const inView = (el) => {
    const r = el.getBoundingClientRect();
    return r.height > 0 && r.top < vh() * 0.95 && r.bottom > 0;
  };

  function tag() {
    const put = (el, mode, i) => {
      if (!el || el.hasAttribute("data-reveal")) return;
      el.setAttribute("data-reveal", mode);
      if (i != null && !el.style.getPropertyValue("--i")) el.style.setProperty("--i", Math.min(i, 6));
    };
    const hero = document.querySelector(".hero:not(.is-hidden)");
    if (hero) {
      put(hero.querySelector("h1"), "mask", 0);
      [...hero.querySelectorAll("p, .kpi")].forEach((el, i) => put(el, "", i + 1));
    }
    // 总览页的大标题是 h2.home-h，同样走揭开动画
    const homeH = document.querySelector("#view .home-h");
    if (homeH) {
      homeH.setAttribute("data-reveal", "mask");
      if (!homeH.style.getPropertyValue("--i")) homeH.style.setProperty("--i", 0);
    }
    document.querySelectorAll("#view .shead, #view .home-h, #view .home-sub, #view .home-facts, #view .newsrow, #view .ncard, #view .threeways, #view .tway, #view .entries, #view .ecard, #view .controls, #view table, #view .card, #view .tcard, #view .irow, #view .evcard, #view .rcard, #view .subrow")
      .forEach((el, i) => put(el, "", i % 12));
  }

  function arm(root = document) {
    tag();
    (root === document ? document : root).querySelectorAll("[data-reveal]").forEach((el, i) => {
      if (el.classList.contains("in")) return;
      if (!el.style.getPropertyValue("--i")) el.style.setProperty("--i", Math.min(i, 6));
      if (inView(el)) requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
      else io.observe(el);
    });
    document.querySelectorAll(".kpi .n").forEach((el) => {
      if (el.dataset.moved) return;
      const raw = el.textContent.trim();
      const m = raw.match(/^([^\d\-+]*)([\d.]+)(.*)$/);
      if (!m) return;
      const to = Number(m[2]);
      if (Number.isNaN(to) || to > 999999) return;
      el.dataset.moved = "1";
      if (inView(el) && !reduced) {
        const dec = (m[2].split(".")[1] || "").length;
        el.textContent = m[1] + (0).toFixed(dec) + m[3];
        countUp(el, to, { dec, pre: m[1], suf: m[3] });
      }
    });
  }

  function progress() {
    const bar = document.createElement("div");
    bar.className = "progress";
    document.body.appendChild(bar);
    const on = () => {
      const h = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = (h > 0 ? (scrollY / h) * 100 : 0) + "%";
    };
    addEventListener("scroll", on, { passive: true });
    on();
  }

  return { arm, progress, reduced };
})();

  function vendorOptions() {

  function filteredModels() {
    const q = state.q.trim().toLowerCase();
    let rows = state.data.models.filter(m => {
      if (state.vendor !== "all" && m.vendor !== state.vendor) return false;
      if (state.band !== "all" && m.band !== state.band) return false;
      if (state.channel !== "all" && m.channelKind !== state.channel) return false;
      if (state.freeOnly && !m.free) return false;
      if (state.paidOnly && m.free) return false;
      if (state.cacheOnly && m.cache_read == null) return false;
      if (q && !(`${m.id} ${m.name} ${m.vendor}`.toLowerCase().includes(q))) return false;
      return true;
    });
    const dir = state.sortDir, key = state.sortKey;
    const val = (m) => {
      if (key === "eff") { const e = effort(m); return e == null ? Infinity : e; }
      if (key === "cache") return m.cache_read == null || !m.input ? Infinity : m.cache_read / m.input;
      if (key === "name") return m.name.toLowerCase();
      if (key === "vendor") return m.vendor.toLowerCase();
      return m[key] == null ? Infinity : m[key];
    };
    rows.sort((a, b) => {
      if (key === "focus") {
        const ra = rankOf(a.vendor), rb = rankOf(b.vendor);
        if (ra !== rb) return ra - rb;
        const ca = a.created || 0, cb = b.created || 0;
        if (ca !== cb) return cb - ca;
        return (a.input ?? 9e9) - (b.input ?? 9e9);
      }
      const va = val(a), vb = val(b);
      if (typeof va === "string") return va.localeCompare(vb) * dir;
      return (va - vb) * dir;
    });
    return rows;
  }

  function th(key, label, num, mob) {
    const active = state.sortKey === key;
    return `<th class="${num ? "num" : ""}${key === "ctx" || key === "cache_write" || mob ? " hidesm" : ""}"
      data-sort="${key}" tabindex="0" role="button"
      aria-sort="${active ? (state.sortDir === 1 ? "ascending" : "descending") : "none"}"

  }

  function modelRows() {
    const rows = filteredModels();
    const bestByFamily = new Map(), bestIdOfFamily = new Map(), familySize = new Map(), secondByFamily = new Map();
    for (const m of rows) familySize.set(m.family, (familySize.get(m.family) || 0) + 1);
    for (const m of rows) {
      if (m.free) continue;
      const e = effort(m);
      if (e == null) continue;
      const cur = bestByFamily.get(m.family);
      if (cur == null || e < cur) {
        if (cur != null) secondByFamily.set(m.family, cur);
        bestByFamily.set(m.family, e); bestIdOfFamily.set(m.family, m.id);
      } else if (e > cur) {
        const s2 = secondByFamily.get(m.family);
        if (s2 == null || e < s2) secondByFamily.set(m.family, e);
      }
    }
    const betterFamily = new Set();
    for (const [k, v] of bestByFamily) {
      const s2 = secondByFamily.get(k);
      if (s2 != null && v < s2 * 0.98) betterFamily.add(k);
    }
    const shown = rows.slice(0, state.limit);
    const tbody = rows.length === 0
      ? `<tr><td colspan="10" class="empty"><b>没有匹配的模型</b>换个关键词，或把价格带切回「全部」。</td></tr>`
      : shown.map(m => {
          const e = effort(m);
          const isBest = !m.free && betterFamily.has(m.family) && bestIdOfFamily.get(m.family) === m.id;
          const disc = m.cache_read != null && m.input ? 1 - m.cache_read / m.input : null;
          return `<tr data-id="${esc(m.id)}">
            <td><div class="mname">${m.free ? '<span class="tag free">免费</span>' : ""}${isNew(m) ? '<span class="tag new">NEW</span>' : ""}

            <td class="vend hidesm">${esc(m.vendor)}</td>
            <td class="num hidesm">${ctx(m.ctx)}</td>
            <td class="num">${m.free ? '<span class="best">0</span>' : money(m.input)}</td>
            <td class="num hidesm">${m.cache_read == null ? '<span class="dim">—</span>' : money(m.cache_read)}</td>
            <td class="num hidesm">${m.cache_write == null ? '<span class="dim">—</span>' : money(m.cache_write)}</td>
            <td class="num">${m.free ? '<span class="best">0</span>' : money(m.output)}</td>
            <td class="num hidesm">${disc == null ? '<span class="dim">—</span>' : `<span class="${disc > .5 ? "best" : ""}">${pct(disc)}</span>`}</td>
            <td class="num">${e == null ? "—" : money(e)}</td>
            <td class="src hidesm"><a href="${esc(m.url)}" target="_blank" rel="noopener"><span class="conf ${m.conf}" title="${esc(confTitle[m.conf] || "")}"></span>${m.channelKind === "direct" ? "官方" : "聚合"} ↗</a></td>
          </tr>`;
        }).join("");
    const tfoot = `<span>显示 ${shown.length} / ${rows.length} 条 · ${state.sortKey === "focus" ? "主流优先（大厂在前、新模型在前）" : "按所选列" + (state.sortDir === 1 ? "升序" : "降序")}</span>
      ${rows.length > shown.length ? `<button class="more" id="moreBtn" type="button">再加载 ${Math.min(120, rows.length - shown.length)} 条</button>` : ""}
      <span class="spacer"></span><span>单位 $ / 1M tokens</span>`;
    return { rows, tbody, tfoot };
  }

  function viewHome() {
    const d = state.data, c = d.meta.counts, fx = state.fx?.rate || d.meta.fx.USDCNY;
    const pricedArr = (d.models || []).filter(m => m.input > 0).map(m => m.input).sort((a, b) => a - b);
    const priced = pricedArr.length;
    const q25 = pricedArr[Math.floor(priced * 0.25)] || 0;
    const q75 = pricedArr[Math.floor(priced * 0.75)] || 0;
    const q50 = pricedArr[Math.floor(priced * 0.5)] || 0;
    const q90 = pricedArr[Math.floor(priced * 0.9)] || 0;
    const pmin = pricedArr[0] || 0;
    const pmax = pricedArr[priced - 1] || 1;
    const spread = pmin > 0 ? Math.round(pmax / pmin) : 1;
    const news = (d.news || []).slice(0, 4);
    const live = (d.relays || []).filter(r => r.status === "ok");
    const best = live
      .map(r => ({ r, p: r.prices?.sonnet55 }))

  /* ── relays ── */
  function viewRelays() {
    const rs = state.data.relays;
    const live = rs.filter(r => r.status === "ok");

      .map(r => ({ name: r.name, p: r.prices?.opus55 }))
      .filter(x => x.p && x.p.kind === "per_1m" && !x.p.anomaly)
      .map(x => ({ name: x.name, v: x.p.input }))
      .sort((a, b) => a.v - b.v);
    const nOpus = opusPts.length;
    const minOpus = nOpus ? opusPts[0].v : 0;
    const maxOpus = nOpus ? opusPts[nOpus - 1].v : 0;
    const official = (state.data.models || []).find(m => /opus/i.test(m.name) && m.channelKind === "direct" && m.input > 0)?.input || 5;
    const spreadTxt = minOpus > 0 ? `${(maxOpus / minOpus).toFixed(1).replace(/\.0$/, "")} 倍价差` : "";
    const cover = live.reduce((n, r) => n + (r.models || 0), 0);
    const sonnet = live.map(r => ({ r, p: r.prices?.sonnet55 })).filter(x => x.p && x.p.kind === "per_1m" && !x.p.anomaly).sort((a,b) => a.p.input - b.p.input)[0];
    const priceCell = (p) => {
      if (!p) return `<span class="dim">—</span>`;
      if (p.kind === "per_call") return `<span class="mono">$${money(p.usd)}/次</span>`;
      return `<span class="mono">${money(p.input)} / ${money(p.output)}</span>${p.anomaly ? ' <span class="tag warn" title="与官方价差异过大，可能为包月或特殊口径">口径?</span>' : ""}`;
    };
    const idxCell = (p, official) => {
      if (!p || p.kind !== "per_1m" || p.anomaly) return `<span class="dim">—</span>`;
      const idx = p.input / official;
      const w = Math.max(4, Math.min(100, idx * 45));
      return `<span class="idx"><span class="bar"><i class="${idx > 1.15 ? "over" : ""}" style="width:${w}%"></i></span><span class="num">${(idx * 100).toFixed(0)}%</span></span>`;
    };
    return `
      <section class="rax">
        <div class="raxhead">
          <h3>Opus 5.5：同一模型，${spreadTxt}</h3>
          <p>${nOpus} 家公开了 Opus 5.5 的输入价，最低 $${money(minOpus)}、最高 $${money(maxOpus)}。条长即价格，红的是高于官方 $${money(official)} 的。</p>

            <th class="num hidesm" style="cursor:default">对官方</th>
            <th class="num hidesm" style="cursor:default">Opus 5.5</th>
            <th class="num hidesm" style="cursor:default">GPT-6.1 Sol</th>
            <th style="cursor:default">状态</th>

            ${rs.filter(r => r.status === "ok" || r.models).map(r => `
              <tr data-relay="${esc(r.domain)}">

                <td class="num">${priceCell(r.prices?.sonnet55)}</td>
                <td class="num hidesm">${idxCell(r.prices?.sonnet55, 2)}</td>
                <td class="num hidesm">${priceCell(r.prices?.opus55)}</td>
                <td class="num hidesm">${priceCell(r.prices?.gpt61sol)}</td>
                <td><span class="status ${r.status === "ok" ? "ok" : "stale"}">${
                  r.status === "ok" ? "公开"
                  : r.status === "no_pricing" ? "无价目"

                  : r.status === "http_404" ? "接口失效"
                  : r.status === "unreachable" ? "未响应"
                  : "未采集"}</span>
                  <a href="https://${esc(r.domain)}" target="_blank" rel="noopener" style="font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:6px">↗</a></td>

  /* ── events ── */
  function viewEvents() {
    const all = state.data.events || [];
    const pass = (e) =>
      (state.evKind === "all" || e.kind === state.evKind) &&
      (state.evSrc === "all" || e.source === state.evSrc) &&
      (state.evRegion === "all" || e.region === state.evRegion);

    const pool = all.filter(pass);
    const open = pool.filter(e => e.status === "open").sort((a, b) => String(a.end || a.start).localeCompare(String(b.end || b.start)));
    const upcoming = pool.filter(e => e.status === "upcoming").sort((a, b) => String(a.start).localeCompare(String(b.start)));
    const past = pool.filter(e => e.status === "past");

    const kindCount = {};

      <div class="controls">
        <div class="chips" role="group" aria-label="活动类型">
          <button class="chip" data-evkind="all" aria-pressed="${state.evKind === "all"}">全部类型</button>
          ${Object.entries(EV_KIND).map(([k, l]) =>
            `<button class="chip" data-evkind="${k}" aria-pressed="${state.evKind === k}">${l}${kindCount[k] ? ` <b style="opacity:.55;font-weight:400">${kindCount[k]}</b>` : ""}</button>`).join("")}
        </div>

          <button class="chip" data-evsrc="all" aria-pressed="${state.evSrc === "all"}">全部来源</button>
          ${["Devpost", "Luma"].map(k =>
            `<button class="chip" data-evsrc="${k}" aria-pressed="${state.evSrc === k}">${esc(EV_SRC[k])}</button>`).join("")}
        </div>
        <div class="chips" role="group" aria-label="地区">

        </div>

      ${open.length > state.evLimit ? `<div style="padding:18px 0"><button class="more" data-evmore type="button">再加载 ${Math.min(18, open.length - state.evLimit)} 个活动</button></div>` : ""}

  /* 图形入场：条从 0 长到目标宽度 */
  function growBars(sel, prop = "width") {
    const els = [...document.querySelectorAll(sel)];
    if (!els.length) return;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    els.forEach((el) => {
      const target = el.style[prop] || getComputedStyle(el)[prop];
      el.dataset.target = target;
      el.style[prop] = prop === "width" ? "0%" : "0px";
      el.style.transition = "none";
    });
    const io2 = new IntersectionObserver((es) => {
      es.forEach((e) => {
        if (!e.isIntersecting) return;
        const el = e.target;
        requestAnimationFrame(() => {
          el.style.transition = reduce ? "none" : `${prop} 1s cubic-bezier(.16,1,.3,1)`;
          el.style[prop] = el.dataset.target;
        });
        io2.unobserve(el);
      });
    }, { threshold: 0.15 });
    els.forEach((el) => io2.observe(el));
  }

  /* ── 价格轴：453 个模型在对数刻度上的分布 ── */
  function renderAxis() {
    const svg = document.getElementById("priceAxis");
    if (!svg) return;
    const rows = (state.data.models || []).filter(m => m.input > 0);
    if (!rows.length) return;

    const W = 1200, H = 260, padL = 8, padR = 8, axisY = H - 34;
    const vals = rows.map(m => m.input);
    const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...vals))));
    const hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...vals))));
    const LX = (v) => padL + (Math.log10(Math.max(v, lo)) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * (W - padL - padR);

    // 对数桶密度 → 决定点云高度
    const BINS = 64;
    const bins = new Array(BINS).fill(0);
    const binOf = (v) => Math.min(BINS - 1, Math.floor((Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * BINS));
    rows.forEach(m => bins[binOf(m.input)]++);
    const maxBin = Math.max(...bins);
    const topY = 12, usable = axisY - topY - 10;

    // 伪随机（保证每次渲染一致）
    const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

    const sorted = [...rows].sort((a, b) => a.input - b.input);
    const qOf = (i) => Math.round(i / Math.max(1, sorted.length - 1) * 100);
    const dots = sorted.map((m, i) => {
      const x = LX(m.input);
      const dens = bins[binOf(m.input)] / maxBin;
      const h = usable * Math.sqrt(dens);
      const y = axisY - 8 - rnd(i) * Math.max(h, 3);
      const kind = m.free ? "free" : (m.channelKind === "aggregator" ? "agg" : "");
      return { x, y, name: m.name, vendor: m.vendor, price: m.input, kind, i, q: qOf(i) };
    });

    // 密度面积：桶中点 + 二次贝塞尔平滑
    const bp = bins.map((v, b) => ({
      x: padL + ((b + 0.5) / BINS) * (W - padL - padR),
      y: axisY - 8 - usable * Math.sqrt(v / maxBin),
    }));
    let den = `M${bp[0].x.toFixed(1)},${axisY - 8}`;
    den += ` L${bp[0].x.toFixed(1)},${bp[0].y.toFixed(1)}`;
    for (let i = 0; i < bp.length - 1; i++) {
      const a = bp[i], n = bp[i + 1];
      const mx = (a.x + n.x) / 2, my = (a.y + n.y) / 2;
      den += ` Q${a.x.toFixed(1)},${a.y.toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
    }
    const last = bp[bp.length - 1];
    den += ` L${last.x.toFixed(1)},${last.y.toFixed(1)} L${last.x.toFixed(1)},${axisY - 8} Z`;

    // 刻度
    const ticks = [];
    for (let p = Math.log10(lo); p <= Math.log10(hi) + 0.001; p++) {
      const v = Math.pow(10, p);
      const x = LX(v);
      ticks.push(`<line class="tick-l" x1="${x.toFixed(1)}" y1="${axisY}" x2="${x.toFixed(1)}" y2="${axisY + 6}"/>`);
      ticks.push(`<line class="grid-l" x1="${x.toFixed(1)}" y1="${topY}" x2="${x.toFixed(1)}" y2="${axisY}"/>`);
      const lbl = v >= 1 ? "$" + v : "$" + v.toFixed(v < 0.01 ? 3 : 2);
      ticks.push(`<text class="tick-t" x="${x.toFixed(1)}" y="${axisY + 20}" text-anchor="middle">${lbl}</text>`);
    }

    // 关键标注
    const med = sorted[Math.floor(sorted.length / 2)];
    const marks = [
      { m: sorted[0], txt: "最便宜" },
      { m: med, txt: "中位" },
      { m: sorted[sorted.length - 1], txt: "最贵" },
    ].map(({ m, txt }) => {
      const x = LX(m.input);
      return `<text class="axlabel" x="${x.toFixed(1)}" y="${topY - 2}" text-anchor="middle">${txt} <tspan font-family="IBM Plex Mono" font-size="11">$${money(m.input)}</tspan></text>`;
    }).join("");

    svg.innerHTML = `
      <path class="den" d="${den.trim()}"/>
      ${ticks.join("")}
      <line class="axline" x1="${padL}" y1="${axisY}" x2="${W - padR}" y2="${axisY}"/>
      ${marks}
      <g id="axDots">${dots.map(d =>
        `<circle class="dot ${d.kind}" cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="2.6" data-q="${d.q}" data-n="${esc(d.name)}" data-v="${esc(d.vendor || "")}" data-p="${d.price}"/>`
      ).join("")}</g>
      <g id="axTip" style="display:none"><line class="axline" y1="${topY}" y2="${axisY}" stroke-dasharray="2 3"/>
        <text class="axlabel" y="${topY - 2}" text-anchor="middle"></text></g>`;

    // 入场：点按 x 依次淡入
    const dotsG = svg.querySelector("#axDots");
    dotsG.style.opacity = "0";
    requestAnimationFrame(() => { dotsG.style.transition = "opacity .9s cubic-bezier(.16,1,.3,1)"; dotsG.style.opacity = "1"; });

    // 悬停
    const tip = svg.querySelector("#axTip");
    const tipLine = tip.querySelector("line");
    const tipText = tip.querySelector("text");
    svg.addEventListener("mousemove", (e) => {
      const r = svg.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width * W;
      let best = null, bd = 1e9;
      for (const d of dots) {
        const dx = Math.abs(d.x - px);
        if (dx < bd) { bd = dx; best = d; }
      }
      dotsG.querySelectorAll(".dot.hot").forEach(el => el.classList.remove("hot"));
      if (!best || bd > 26) { tip.style.display = "none"; return; }
      const el = dotsG.querySelector(`circle[data-p="${best.price}"][cx="${best.x.toFixed(1)}"]`);
      if (el) el.classList.add("hot");
      tip.style.display = "";
      tipLine.setAttribute("x1", best.x); tipLine.setAttribute("x2", best.x);
      tipText.setAttribute("x", best.x);
      tipText.textContent = `${best.name}  $${money(best.price)}`;
    });
    svg.addEventListener("mouseleave", () => {
      tip.style.display = "none";
      dotsG.querySelectorAll(".dot.hot").forEach(el => el.classList.remove("hot"));
    });

    bindStory();
  }

  /* ── 滚动叙事：轴随滚动收窄 ──
     注意：不能把 DOM 捕获进闭包 —— render() 会重建 #view，旧节点会脱离文档，
     滚动回调就在操作幽灵元素。每次回调都重新查询。 */
  let storyWired = false;
  let storyStage = -1;
  const STORY_CUTS = [100, 25, 50, 90];

  function updateStory() {
    const track = document.querySelector(".story-track");
    if (!track) return;
    const rail = document.getElementById("storyRail");
    const dots = document.querySelectorAll("#priceAxis .dot");
    const lines = document.querySelectorAll(".story-line");
    if (!dots.length) return;

    const r = track.getBoundingClientRect();
    const span = r.height - innerHeight;
    const prog = span > 0 ? Math.min(1, Math.max(0, -r.top / span)) : 0;
    if (rail) rail.style.width = (prog * 100).toFixed(1) + "%";

    const idx = Math.min(STORY_CUTS.length - 1, Math.floor(prog * STORY_CUTS.length));
    if (idx === storyStage) return;
    storyStage = idx;
    const cut = STORY_CUTS[idx];
    dots.forEach((d) => {
      const lit = Number(d.dataset.q) <= cut;
      d.classList.toggle("lit", lit);
      d.classList.toggle("dim", !lit);
    });
    lines.forEach((l, i) => l.classList.toggle("on", i === idx));
  }

  function bindStory() {
    if (!storyWired) {
      addEventListener("scroll", updateStory, { passive: true });
      addEventListener("resize", updateStory);
      storyWired = true;
    }
    storyStage = -1;
    updateStory();
  }

  function renderRelayAxis() {
    const host = document.getElementById("relayBars");
    if (!host) return;
    const live = (state.data.relays || []).filter(r => r.status === "ok");
    const rows = live.map(r => ({ name: r.name, url: r.url, p: r.prices?.opus55 }))
      .filter(x => x.p && x.p.kind === "per_1m" && !x.p.anomaly)
      .map(x => ({ name: x.name, url: x.url, v: x.p.input }))
      .sort((a, b) => a.v - b.v);
    if (!rows.length) { host.parentElement.style.display = "none"; return; }

    const official = (state.data.models || []).find(m => /opus/i.test(m.name) && m.channelKind === "direct" && m.input > 0)?.input || 5;
    const max = rows[rows.length - 1].v;
    const min = rows[0].v;

    host.innerHTML = rows.map((r, i) => {
      const pct = Math.max(6, (r.v / max) * 100);
      const ratio = r.v / official;
      const cls = ratio < 0.99 ? "low" : ratio > 1.01 ? "high" : "";
      const tag = ratio < 0.99 ? "低于官方" : ratio > 1.01 ? `${ratio.toFixed(1)}× 官方` : "官方价";
      return `<a class="rb ${cls}" href="${esc(r.url || "#")}" target="_blank" rel="noopener">
        <span class="rb-n">${esc(r.name)}</span>
        <span class="rb-bar"><i style="--w:${pct.toFixed(1)}%; --i:${i}"></i></span>
        <span class="rb-v">$${money(r.v)}</span>
        <span class="rb-x">${tag}</span>
      </a>`;
    }).join("");
  }

  function renderSubBars() {
    const host = document.getElementById("subBars");
    if (!host) return;
    const plans = (state.data.subsRegions || []).filter(p => p.cheapest > 0 && p.priciest > 0);
    if (!plans.length) { host.style.display = "none"; return; }
    const gMin = Math.min(...plans.map(p => p.cheapest));
    const gMax = Math.max(...plans.map(p => p.priciest));
    const SPAN = Math.log10(gMax) - Math.log10(gMin) || 1;
    const pos = (v) => (Math.log10(v) - Math.log10(gMin)) / SPAN * 100;

    host.innerHTML = [...plans].sort((a, b) => (b.priciest / b.cheapest) - (a.priciest / a.cheapest)).map((p, i) => {
      const l = pos(p.cheapest), r = pos(p.priciest);
      const ratio = (p.priciest / p.cheapest);
      return `<a class="sb" href="${esc(p.rows?.[0]?.url || "#")}" target="_blank" rel="noopener">
        <span class="sb-n">${esc(p.plan)}</span>
        <span class="sb-track"><i style="left:${l.toFixed(1)}%; --w:${Math.max(2, r - l).toFixed(1)}%; --i:${i}"></i></span>
        <span class="sb-v">¥${Math.round(p.cheapest)} → ¥${Math.round(p.priciest)}</span>
        <span class="sb-x">${ratio.toFixed(1).replace(/\.0$/, "")}×</span>
      </a>`;
    }).join("");
  }

  function renderTimeline() {
    const svg = document.getElementById("eventTimeline");
    if (!svg) return;
    const evs = (state.data.events || []).filter(e => e.status !== "past" && e.start && e.end);
    if (!evs.length) { svg.parentElement.style.display = "none"; return; }

    const DAY = 864e5;
    const t = (s) => Date.parse(s + "T00:00:00Z");
    const now = Date.now();
    const starts = evs.map(e => t(e.start) || now);
    const ends = evs.map(e => t(e.end) || now);
    const minD = Math.min(now - 7 * DAY, ...starts);
    const maxD = Math.max(now + 21 * DAY, ...ends);
    const W = 1200, H = 260, padL = 3, padR = 3, top = 22, bot = H - 26;
    const X = (d) => padL + (d - minD) / (maxD - minD) * (W - padL - padR);

    const sorted = [...evs].sort((a, b) => (t(a.start) - t(b.start)) || (t(a.end) - t(b.end)));
    const rowH = Math.min(3.4, (bot - top) / sorted.length);
    const colors = { hackathon: "#0a0a0a", conference: "#e11d48", meetup: "#0f7b4f" };

    let bars = "";
    sorted.forEach((e, i) => {
      const x1 = X(t(e.start)), x2 = Math.max(X(t(e.end)), x1 + 2);
      const y = top + i * rowH;
      const col = colors[e.kind] || "#b9b9b9";
      bars += `<rect class="tl-bar" x="${x1.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(2, x2 - x1).toFixed(1)}"
        height="${Math.max(1.8, rowH - 0.9).toFixed(1)}" fill="${col}" opacity=".72" rx="0.6"><title>${esc(e.title)} · ${esc(e.dates || "")}</title></rect>`;
    });

    // 月份刻度
    let grid = "";
    const d0 = new Date(minD), d1 = new Date(maxD);
    for (let y = d0.getUTCFullYear(), m = d0.getUTCMonth(); ;) {
      const cur = Date.UTC(y, m, 1);
      if (cur > maxD) break;
      if (cur >= minD) {
        const x = X(cur);
        grid += `<line class="tl-grid" x1="${x.toFixed(1)}" y1="${top - 6}" x2="${x.toFixed(1)}" y2="${bot}"/>`;
        grid += `<text class="tl-t" x="${(x + 4).toFixed(1)}" y="${H - 8}">${m + 1}月</text>`;
      }
      m++; if (m > 11) { m = 0; y++; }
    }

    const xn = X(now);
    svg.innerHTML = `${grid}${bars}
      <line class="tl-now" x1="${xn.toFixed(1)}" y1="${top - 8}" x2="${xn.toFixed(1)}" y2="${bot}"/>
      <text class="tl-nowt" x="${xn.toFixed(1)}" y="${top - 12}" text-anchor="middle">今天</text>`;
  }



  /* ── 工具箱：星数带（对数刻度） ── */
  function renderStarBand() {
    const host = document.getElementById("starBand");
    if (!host) return;
    const rows = (state.data.resources || []).filter(r => r.status === "ok" && r.stars > 0)
      .sort((a, b) => b.stars - a.stars);
    if (!rows.length) { host.style.display = "none"; return; }
    const lo = Math.log10(rows[rows.length - 1].stars);
    const hi = Math.log10(rows[0].stars);
    const span = hi - lo || 1;
    host.innerHTML = rows.map((r, i) => {
      const pct = ((Math.log10(r.stars) - lo) / span) * 100;
      return `<a class="sbrow" href="${esc(r.url || "#")}" target="_blank" rel="noopener">
        <span class="n">${esc(r.title)}</span>
        <span class="t"><i style="--w:${Math.max(3, pct).toFixed(1)}%; --i:${i}"></i></span>
        <span class="s">${kfmt(r.stars)}</span>
      </a>`;
    }).join("");
  }


  /* ── 评测：分数 × 价格散点（每个点都标名字，标出最值与性价比之王） ── */
  function benchPoints() {
    const rows = state.data.bench?.rows || [];
    const models = state.data.models || [];
    const findPrice = (name) => {
      const exact = models.find(m => m.name === name && m.input > 0);
      if (exact) return exact.input;
      const key = name.toLowerCase().replace(/\s+/g, " ");
      const near = models.find(m => m.input > 0 &&
        (m.name.toLowerCase().includes(key) || key.includes(m.name.toLowerCase())));
      return near ? near.input : null;
    };
    return rows.map(r => ({ name: r.model, score: r.score, price: findPrice(r.model) }))
      .filter(p => p.price != null && p.price > 0)
      .map(p => ({ ...p, value: p.score / p.price }))
      .sort((a, b) => b.score - a.score);
  }

  function renderBenchScatter() {
    const svg = document.getElementById("benchScatter");
    if (!svg) return;
    const mode = state.benchTab || "official";
    const src = mode === "community" ? benchCommunity() : benchOfficial().map(r => ({ ...r, value: r.price ? r.score / r.price : 0 }));
    const pts = src.filter(p => p.price != null && p.price > 0);
    if (pts.length < 3) { svg.parentElement.style.display = "none"; return; }

    const W = 1200, H = 340, padL = 54, padR = 150, padT = 26, padB = 48;
    const ps = pts.map(p => p.price), sc = pts.map(p => p.score);
    const lo = Math.min(...ps) * 0.7, hi = Math.max(...ps) * 1.4;
    const sLo = Math.floor((Math.min(...sc) - 3) / 5) * 5, sHi = Math.ceil((Math.max(...sc) + 3) / 5) * 5;
    const X = (v) => padL + (Math.log10(v) - Math.log10(lo)) / ((Math.log10(hi) - Math.log10(lo)) || 1) * (W - padL - padR);
    const Y = (v) => padT + (1 - (v - sLo) / (sHi - sLo)) * (H - padT - padB);

    // 网格
    let grid = "";
    for (let p = Math.floor(Math.log10(lo)); p <= Math.ceil(Math.log10(hi)); p++) {
      const v = Math.pow(10, p);
      if (v < lo || v > hi) continue;
      const x = X(v);
      grid += `<line class="bs-grid" x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${H - padB}"/>`;
      grid += `<text class="bs-t" x="${x.toFixed(1)}" y="${H - padB + 20}" text-anchor="middle">$${v >= 1 ? v : v.toFixed(2)}</text>`;
    }
    for (let v = sLo; v <= sHi; v += 5) {
      const y = Y(v);
      grid += `<line class="bs-grid" x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}"/>`;
      grid += `<text class="bs-t" x="${padL - 10}" y="${(y + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
    }

    const best = pts.reduce((a, b) => (a.score >= b.score ? a : b));
    const value = pts.reduce((a, b) => ((a.value || 0) >= (b.value || 0) ? a : b));
    const useValue = mode !== "community";

    // 标签避让：右侧放得下就右置，否则左置；同名竖直错开
    const placed = [];
    const dots = pts.map((p) => {
      const x = X(p.price), y = Y(p.score);
      const isBest = p === best, isValue = useValue && p === value;
      const right = x < W - padR - 8;
      let ly = y + 4;
      for (const q of placed) {
        if (Math.abs(q.x - x) < 96 && Math.abs(q.y - ly) < 13) ly = q.y + 13;
      }
      placed.push({ x, y: ly });
      const cls = isBest ? "top" : isValue ? "val" : "";
      return `<circle class="bs-pt ${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isBest || isValue ? 5.2 : 3.6}">
          <title>${esc(p.name)} · $${money(p.price)} · ${p.score.toFixed(2)} 分</title></circle>
        <text class="bs-lb ${cls}" x="${(right ? x + 9 : x - 9).toFixed(1)}" y="${ly.toFixed(1)}"
          text-anchor="${right ? "start" : "end"}">${esc(p.name)}</text>`;
    }).join("");

    // 性价比参考线（从原点到性价比之王）
    const vx = X(value.price), vy = Y(value.score);
    const guide = `<line class="bs-guide" x1="${X(lo).toFixed(1)}" y1="${(H - padB).toFixed(1)}" x2="${vx.toFixed(1)}" y2="${vy.toFixed(1)}"/>`;

    svg.innerHTML = `${grid}${guide}
      <line class="bs-ax" x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}"/>
      <line class="bs-ax" x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}"/>
      <text class="bs-axt" x="${(padL + (W - padL - padR) / 2).toFixed(0)}" y="${H - 6}" text-anchor="middle">每 1M 输入 token 价格（对数）</text>
      <text class="bs-axt" transform="translate(14,${(padT + (H - padT - padB) / 2).toFixed(0)}) rotate(-90)" text-anchor="middle">${mode === "community" ? "口碑分（按调用量归一化）" : "Vals Index 分数"}</text>
      ${dots}`;
  }

  /* ── bench ── */
  /* 官方基准（Vals）与民间选择（OpenRouter 实际调用量）分开成两张榜 */
  function benchOfficial() {
    const rows = state.data.bench?.rows || [];
    const models = state.data.models || [];
    const price = (name) => {
      const exact = models.find(m => m.name === name && m.input > 0);
      if (exact) return exact.input;
      const key = name.toLowerCase();
      const near = models.find(m => m.input > 0 && (m.name.toLowerCase().includes(key) || key.includes(m.name.toLowerCase())));
      return near ? near.input : null;
    };
    return rows.map(r => ({ name: r.model, score: r.score, delta: r.delta, price: price(r.model) }));
  }

  function benchCommunity() {
    const src = state.data.orModels || [];
    const models = state.data.models || [];
    if (!src.length) return [];

    // 同一模型的多个快照合并成一条
    const merged = new Map();
    for (const x of src) {
      const parts = x.slug.split("/");
      const bare = (parts[1] || parts[0]).replace(/-\d{8}$/, "");
      merged.set(bare, (merged.get(bare) || 0) + x.tokens);
    }
    const rows = [...merged.entries()].map(([bare, tokens]) => {
      // 优先用价格表里的正式写法，找不到就把 slug 还原成人话
      const norm = (t) => t.toLowerCase()
        .replace(/^[a-z0-9.\-]+\s*:\s*/, "")   // 去掉 "Z.ai: " 这类厂商前缀
        .replace(/[\s.\-_()（）]+/g, "");
      const key = norm(bare);
      const m = models.find(y => y.input > 0 && norm(y.name) === key)
        || models.find(y => y.input > 0 && norm(y.name).startsWith(key))
        || models.find(y => y.input > 0 && key.startsWith(norm(y.name)));
      const name = m ? m.name : bare.replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
      return { name, tokens, price: m ? m.input : null };
    }).sort((a, b) => b.tokens - a.tokens);

    const toks = rows.map(r => r.tokens);
    const lo = Math.log10(Math.min(...toks)), hi = Math.log10(Math.max(...toks));
    const span = hi - lo || 1;
    return rows.map((r, i) => ({
      ...r,
      rank: i + 1,
      score: 40 + 60 * ((Math.log10(r.tokens) - lo) / span),
    }));
  }

      </section>
      <div class="tablewrap" tabindex="0" role="region" aria-label="官方基准榜">
        <table><caption class="sr">Vals Index 公开分数</caption>
          <thead><tr><th>#</th><th>模型</th><th>分数</th><th class="num hidesm">每美元分数</th><th class="num">较上次</th><th class="num hidesm">来源</th></tr></thead>
          <tbody>

            <td><b>${esc(r.name)}</b></td>
            <td><span class="idx" style="justify-content:flex-start"><span class="bar" style="width:120px"><i style="width:${Math.max(4, (r.score / maxO) * 100).toFixed(1)}%"></i></span><span class="num">${r.score.toFixed(2)}</span></span></td>
            <td class="num hidesm">${r.price ? `<span class="val">${(r.score / r.price).toFixed(0)}</span>` : '<span class="dim">—</span>'}</td>

          <p>纵轴是根据 OpenRouter 实际处理 token 量归一化的口碑分（对数刻度，不是投票）。横轴仍是每百万输入 token 的价格。</p>
        </div>

        <table><caption class="sr">OpenRouter 实际调用量</caption>
          <thead><tr><th>#</th><th>模型</th><th>口碑分</th><th class="num">调用量</th><th class="num hidesm">价格 /1M</th></tr></thead>
          <tbody>
          ${community.map((r, i) => `<tr>
            <td class="num" style="width:34px">${i + 1}</td>
            <td><b>${esc(r.name)}</b></td>
            <td><span class="idx" style="justify-content:flex-start"><span class="bar" style="width:120px"><i style="width:${Math.max(4, ((r.score - 40) / 60) * 100).toFixed(1)}%"></i></span><span class="num">${r.score.toFixed(1)}</span></span></td>
            <td class="num">${(r.tokens / 1e12).toFixed(1)}T</td>

      <p class="tnote">按 OpenRouter 实际处理的 token 量排，反映开发者真正把哪些工具接进了工作流。</p>
      <div class="applist">
        ${apps.map(a => `<a class="approw" href="https://openrouter.ai/apps/${esc(a.slug || "")}" target="_blank" rel="noopener">

          <span class="ar-t"><i style="width:${Math.max(3, Math.min(100, (Math.log10(Math.max(a.tokens, 1)) / Math.log10(6e13)) * 100)).toFixed(1)}%"></i></span>
          <span class="ar-v">${(a.tokens / 1e12).toFixed(1)}T</span>
        </a>`).join("")}
