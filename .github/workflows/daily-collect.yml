name: daily-collect

# 每天北京时间 09:00 重采一次，把 data.json 提交回仓库；
# Cloudflare Pages / Vercel 监听 main 分支，提交后自动重建。
on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 = Asia/Shanghai 09:00
  workflow_dispatch: # 也可以手动点一下立刻跑

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # collect.mjs 只依赖内置 fetch，没有 npm install
      - name: Collect
        run: node collect.mjs

      - name: Commit data.json
        run: |
          if [ -z "$(git status --porcelain data.json)" ]; then
            echo "data.json 没变化，跳过提交"
            exit 0
          fi
          git config user.name  "indexai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "chore(data): $(date -u +%F) 自动采集"
          git push

      - name: Summary
        run: |
          node -e '
            const d = require("./data.json");
            const c = d.meta.counts;
            console.log("## 采集完成");
            console.log("| 指标 | 数量 |");
            console.log("|---|---|");
            for (const [k, v] of Object.entries(c)) console.log(`| ${k} | ${v} |`);
          ' >> "$GITHUB_STEP_SUMMARY"
