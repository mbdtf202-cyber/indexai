name: daily-collect

# 云端采集 + 发布：不再依赖本机开机。
# 每天 UTC 01:00（北京 09:00）跑 collect.mjs，然后直传 Cloudflare Pages。
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # collect.mjs 只用内置 fetch，没有 npm install
      - name: 采集
        env:
          # 用内置 token 拉 GitHub API，限额从 60/h 提到 5000/h
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node collect.mjs

      - name: 组装发布目录
        run: |
          mkdir -p dist
          cp index.html data.json dist/
          [ -f favicon.svg ] && cp favicon.svg dist/ || true
          [ -f logo-preview.html ] && cp logo-preview.html dist/ || true
          [ -f _headers ] && cp _headers dist/ || true
          du -sh dist

      - name: 发布到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7beaa67bbff49099132fb4a13b99fb2b
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=indexai \
            --branch=main \
            --commit-dirty=true \
            --commit-message="ci: $(date -u +%FT%TZ)"

      - name: 摘要
        run: |
          node -e '
            const d = require("./data.json");
            const c = d.meta.counts;
            const rows = Object.entries(c).map(([k,v]) => `| ${k} | ${v} |`).join("\n");
            console.log("## 采集完成\n\n| 指标 | 数量 |\n|---|---|\n" + rows);
          ' >> "$GITHUB_STEP_SUMMARY"
