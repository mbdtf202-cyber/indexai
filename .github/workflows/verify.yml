name: verify

# 每个 PR 与推送到 ralph/* 都跑完整 verify。
# 门禁只读：默认 permissions 是 contents: read，写权限按需下放到具体 job（S1.6 · T2.2）。
on:
  pull_request:
  push:
    branches:
      - main
      - 'ralph/**'

# 同一 ref 上新的推送取消旧运行：省 runner，也避免旧结果盖新结果
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # e2e 需要 Chromium；--with-deps 装上运行库，省得后面报缺 .so
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # lint → typecheck → invariants → test → build → e2e
      - name: Verify
        run: npm run verify

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
