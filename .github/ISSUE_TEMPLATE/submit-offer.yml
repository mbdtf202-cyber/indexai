name: 投稿免费额度
description: 推荐一个仍在发放的 AI 免费额度或赠送金
title: "[投稿] 免费额度："
labels: ["submission", "offers"]
body:
  - type: input
    id: product
    attributes:
      label: 产品名称
      placeholder: "例如：Gemini CLI"
    validations:
      required: true
  - type: input
    id: vendor
    attributes:
      label: 厂商
      placeholder: "例如：Google"
  - type: textarea
    id: quota
    attributes:
      label: 额度内容
      description: 数量、单位、有效期、适用模型、地区限制
      placeholder: 每月 100 万 token，限新用户，需绑定信用卡…
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 官方来源链接
      placeholder: https://example.com/free
    validations:
      required: true
  - type: input
    id: expires
    attributes:
      label: 截止日期
      description: 长期有效可留空
      placeholder: 2026-12-31
