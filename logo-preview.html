<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IndexAI · Logo 方案</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5ef; --panel:#fffefb; --panel2:#f1eee4; --ink:#16170f; --dim:#575a4e; --faint:#8a8d7f;
  --line:rgba(22,23,15,.12); --line2:rgba(22,23,15,.26); --accent:#16a34a;
  --sans:"Archivo","PingFang SC","Noto Sans SC",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
header{padding:44px 0 26px;border-bottom:1px solid var(--line)}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
h1{margin:10px 0 8px;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.03em;line-height:1.1}
.lead{margin:0;color:var(--dim);font-size:14px;line-height:1.7;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.opt{background:var(--panel);padding:24px 24px 22px;display:flex;flex-direction:column;gap:16px}
.opt-h{display:flex;align-items:baseline;gap:10px}
.opt-n{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.1em}
.opt-h h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.opt-d{margin:0;font-size:12px;color:var(--dim);line-height:1.65;min-height:38px}
.stage{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:22px 0 4px}
.big{color:var(--accent)}
.lock{display:flex;align-items:center;gap:9px}
.lock b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.lock .lg{color:var(--accent)}
.favs{display:flex;align-items:flex-end;gap:14px}
.favs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.favs figcaption{font-family:var(--mono);font-size:8px;color:var(--faint)}
.darkbar{background:#0d0e0c;border-radius:4px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.darkbar .lock b{color:#eceade}
.darkbar .lg{color:#4ade80}
svg{display:block}
footer{padding:26px 0 60px;color:var(--faint);font-size:11.5px;font-family:var(--mono)}
</style>
</head>
<body>

<header class="wrap">
  <div class="kick">Brand · 六个方向</div>
  <h1>IndexAI 标识方案</h1>
  <p class="lead">全部单色、纯几何、无渐变。每个方案给四种用法：大图标、字标组合、favicon 16/32、深色底。选一个编号告诉我，我直接换到站点里。</p>
</header>

<main class="grid" id="grid"></main>

<footer class="wrap">IndexAI · logo exploration · 2026-10-23</footer>

<script>
const OPTIONS = [
  {
    id: "A", name: "缺口方块", desc: "一个方块，右上角让出一格。索引里“被查过的那一条”，也顺便暗示价格曲线在拐。",
    icon: `<path d="M3 3h12v5h5v16H3z" fill="currentColor"/>`
  },
  {
    id: "B", name: "嵌套框", desc: "外框套实心块。七层数据收进一个框里，缩到 16px 还能认出是“框里有东西”。",
    icon: `<rect x="2.5" y="2.5" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.6"/>
           <rect x="8.5" y="8.5" width="7" height="7" fill="currentColor"/>`
  },
  {
    id: "C", name: "价格柱", desc: "三根高低柱，直接就是“比价”。最贴合站点的功能，也最适合当 favicon。",
    icon: `<rect x="3" y="13" width="4.4" height="8" fill="currentColor"/>
           <rect x="10" y="7" width="4.4" height="14" fill="currentColor"/>
           <rect x="17" y="3" width="4.4" height="18" fill="currentColor"/>`
  },
  {
    id: "D", name: "索引斜杠", desc: "一道粗斜杠——索引符号本身，也是价格曲线的斜率。最省事的那一刻：它天然就是一个 favicon。",
    icon: `<path d="M14.6 2h5.2L9.4 22H4.2z" fill="currentColor"/>`
  },
  {
    id: "E", name: "四格索引", desc: "2×2 网格，右下角那一格变虚。七层里少一层——留白，也是“持续在补”的意思。",
    icon: `<rect x="2.5" y="2.5" width="8" height="8" fill="currentColor"/>
           <rect x="13.5" y="2.5" width="8" height="8" fill="currentColor"/>
           <rect x="2.5" y="13.5" width="8" height="8" fill="currentColor"/>
           <rect x="13.5" y="13.5" width="8" height="8" fill="currentColor" opacity=".28"/>`
  },
  {
    id: "F", name: "菱形切口", desc: "旋转 45° 的实心菱形，中间镂空一个小方。透明镂空，深浅底都不会露馅。",
    icon: `<path fill-rule="evenodd" d="M12 1.6 22.4 12 12 22.4 1.6 12zM12 9.4 14.6 12 12 14.6 9.4 12z" fill="currentColor"/>`
  }
];

function svg(icon, size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>`;
}

document.getElementById("grid").innerHTML = OPTIONS.map(o => `
  <section class="opt">
    <div class="opt-h"><span class="opt-n">${o.id}</span><h2>${o.name}</h2></div>
    <p class="opt-d">${o.desc}</p>
    <div class="stage">
      <span class="big">${svg(o.icon, 64)}</span>
      <span class="lock"><span class="lg">${svg(o.icon, 18)}</span><b>IndexAI</b></span>
    </div>
    <div class="favs">
      <figure>${svg(o.icon, 32)}<figcaption>32</figcaption></figure>
      <figure>${svg(o.icon, 16)}<figcaption>16</figcaption></figure>
      <figure>${svg(o.icon, 24).replace('<svg ', '<svg style="filter:none" ')}<figcaption>24</figcaption></figure>
    </div>
    <div class="darkbar"><span class="lg">${svg(o.icon, 18)}</span><span class="lock" style="gap:8px"><b>IndexAI</b></span></div>
  </section>
`).join("");
</script>
</body>
</html>
